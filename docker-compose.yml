services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: genkit_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-genkit_ai}
      MYSQL_USER: ${MYSQL_USER:-genkit_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-genkit_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: genkit_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache & Distributed Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: genkit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Genkit AI FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: genkit_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-genkit_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-genkit_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-genkit_ai}
      - SECRET_KEY=${SECRET_KEY:-genkit-ai-v6-production-secret-key-32bytes}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend/datasets:/app/backend/datasets
      - ./backend/genkit-model:/app/backend/genkit-model
      - ./backend/logs:/app/backend/logs
      - ./backend/reports:/app/backend/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 4. Production Frontend (Nginx multi-stage bundle)
  # 4. Production Frontend (Nginx multi-stage bundle)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: genkit_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local
