# Production Docker Compose Configuration
services:
  mysql:
    image: mysql:8.0
    container_name: genkit_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-genkit_ai}
      MYSQL_USER: ${MYSQL_USER:-genkit_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # MySQL is NOT exposed publicly in production

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: genkit_backend_prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-genkit_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-genkit_ai}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend/datasets:/app/backend/datasets:ro
      - ./backend/genkit-model:/app/backend/genkit-model:ro
      - ./backend/logs:/app/backend/logs
      - ./backend/reports:/app/backend/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.genkit.in}
    container_name: genkit_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  mysql_prod_data:
    driver: local
